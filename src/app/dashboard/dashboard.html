<div class="dashboard-container">
    <h2 class="mat-headline-small">Hello, {{ user?.displayName }}!</h2>

    <mat-card class="leaderboard-card mat-elevation-z12" appearance="outlined">
        <mat-card-header>
            <mat-card-title>Points Leaderboard</mat-card-title>
        </mat-card-header>
        <mat-card-content>
            <mat-chip-set>
                <mat-chip>Add Dish Points</mat-chip>
                <mat-chip>Add Cooking Points</mat-chip>
            </mat-chip-set>
            <table mat-table [dataSource]="dataSource" matSort (matSortChange)="announceSortChange($event)"
                class="mat-elevation-z8">
                <ng-container matColumnDef="name">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Sort by name">
                        Name
                    </th>
                    <td mat-cell *matCellDef="let element"> {{element.name}} </td>
                </ng-container>
                <ng-container matColumnDef="dishPoints">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Sort by dishPoints">
                        Dish Points
                    </th>
                    <td mat-cell *matCellDef="let element"> {{element.dishPoints}} </td>
                </ng-container>
                <ng-container matColumnDef="cookingPoints">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Sort by cookingPoints">
                        Cooking Points
                    </th>
                    <td mat-cell *matCellDef="let element"> {{element.cookingPoints}} </td>
                </ng-container>
                <ng-container matColumnDef="total">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Sort by total">
                        Total Points
                    </th>
                    <td mat-cell *matCellDef="let element"> {{element.dishPoints + element.cookingPoints}} </td>
                </ng-container>
                

                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
            </table>
        </mat-card-content>
    </mat-card>


</div>

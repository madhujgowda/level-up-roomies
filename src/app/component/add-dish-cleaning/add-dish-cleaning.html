<div class="container">
  <mat-card class="add-dish-cleaning-card mat-elevation-z12" appearance="outlined">
    <mat-card-header>
      <mat-card-title>Add Dish Cleaning Record</mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Date Cleaned</mat-label>
        <input matInput [matDatepicker]="picker" [formControl]="cleanedDateControl">
        <mat-hint>MM/DD/YYYY</mat-hint>
        <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
        <mat-datepicker #picker></mat-datepicker>
      </mat-form-field>
    </mat-card-content>

    <mat-card-actions align="end">
      <button mat-button routerLink="/dashboard">Cancel</button>
      <button 
        mat-flat-button 
        color="primary" 
        (click)="onSave()" 
        [disabled]="cleanedDateControl.invalid">
        Save Record
      </button>
    </mat-card-actions>
  </mat-card>
</div>

<mat-tab-group (selectedTabChange)="onTabChange($event)">
  <mat-tab label="Dish Cleaning">
    <table mat-table [dataSource]="dataSourceDishes" class="mat-elevation-z8">

      <ng-container matColumnDef="userName">
        <th mat-header-cell *matHeaderCellDef> Roomie </th>
        <td mat-cell *matCellDef="let element"> {{element.userName}} </td>
      </ng-container>

      <ng-container matColumnDef="cleanedDate">
        <th mat-header-cell *matHeaderCellDef> Date Cleaned </th>
        <td mat-cell *matCellDef="let element"> {{element.cleanedDate.toDate() | date:'MM/dd/yyyy'}} </td>
      </ng-container>

      <ng-container matColumnDef="previousPoints">
        <th mat-header-cell *matHeaderCellDef> Points Before </th>
        <td mat-cell *matCellDef="let element"> {{element.previousPoints}} </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedDishColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedDishColumns;"></tr>
    </table>
  </mat-tab>

  <mat-tab label="Cooking">
    <table mat-table [dataSource]="dataSourceCooking" class="mat-elevation-z8">

      <ng-container matColumnDef="dishType">
        <th mat-header-cell *matHeaderCellDef> Dish </th>
        <td mat-cell *matCellDef="let element"> {{element.dishType}} </td>
      </ng-container>

      <ng-container matColumnDef="chefs">
        <th mat-header-cell *matHeaderCellDef> Chefs </th>
        <td mat-cell *matCellDef="let element"> 
    <span *ngFor="let chef of element.chefs; let last = last">
      
      <span class="clickable-chef" [matMenuTriggerFor]="menu">
        {{ chef.name }} ({{ chef.pointsEarned }})
      </span>
      
      <mat-menu #menu="matMenu">
        <button mat-menu-item>Previous: {{ chef.previousPoints }}</button>
        <button mat-menu-item>New Total: {{ chef.previousPoints + chef.pointsEarned }}</button>
      </mat-menu>
      
      {{ !last ? ', ' : '' }}
    </span>
  </td>
      </ng-container>

      <ng-container matColumnDef="cookedDate">
        <th mat-header-cell *matHeaderCellDef> Date Cooked </th>
        <td mat-cell *matCellDef="let element">
          {{element.cookedDate | date:'shortDate'}}
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedCookingColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedCookingColumns;"></tr>
    </table>
  </mat-tab>
</mat-tab-group>

<div class="dashboard-container">
    <h2 class="mat-headline-small">Hello, {{ user?.displayName }}!</h2>

    <mat-card class="leaderboard-card mat-elevation-z12" appearance="outlined">
        <mat-card-header>
            <mat-card-title>Points Leaderboard</mat-card-title>
        </mat-card-header>
        <mat-card-content>
            <div class="action-button-row">
                <button style="margin-right: 5px; margin-bottom: 2.5px;" mat-stroked-button routerLink="/add-dish-cleaning">Add Dish Cleaning</button>
                <button style="margin-bottom: 2.5px;" mat-stroked-button routerLink="/add-cooking">Add Cooking</button>
            </div>
            <div class="table-responsive">
                <!-- horizontal scroll wrapper for small devices -->
                <table mat-table [dataSource]="dataSource" matSort (matSortChange)="announceSortChange($event)"
                    class="mat-elevation-z8">
                    <ng-container matColumnDef="name">
                        <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Sort by name">
                            Name
                        </th>
                        <td mat-cell *matCellDef="let element"> {{element.name}} </td>
                    </ng-container>
                    <ng-container matColumnDef="dishCleaningPoints">
                        <th mat-header-cell *matHeaderCellDef mat-sort-header
                            sortActionDescription="Sort by dishCleaningPoints">
                            Dish Cleaning
                        </th>
                        <td mat-cell *matCellDef="let element"> {{element.dishCleaningPoints}} </td>
                    </ng-container>
                    <ng-container matColumnDef="cookingPoints">
                        <th mat-header-cell *matHeaderCellDef mat-sort-header
                            sortActionDescription="Sort by cookingPoints">
                            Cooking
                        </th>
                        <td mat-cell *matCellDef="let element"> {{element.cookingPoints}} </td>
                    </ng-container>
                    <ng-container matColumnDef="total">
                        <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Sort by total">
                            Total Points
                        </th>
                        <td mat-cell *matCellDef="let element"> {{element.dishCleaningPoints + element.cookingPoints}}
                        </td>
                    </ng-container>


                    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
                </table>
            </div>
        </mat-card-content>
    </mat-card>


</div>

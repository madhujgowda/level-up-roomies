<div *ngIf="showNav; else simpleLayout">
    <mat-sidenav-container class="sidenav-container">

        <mat-sidenav #drawer class="sidenav" [mode]="(isHandset$ | async) ? 'over' : 'side'"
            [opened]="!(isHandset$ | async)">
            <mat-toolbar>Menu</mat-toolbar>
            <mat-nav-list>
                <a mat-list-item routerLink="/dashboard" (click)="drawerToggle(drawer)">
                    <mat-icon matListItemIcon>dashboard</mat-icon>
                    <span matListItemTitle>Dashboard</span>
                </a>
                <a mat-list-item routerLink="/history" (click)="drawerToggle(drawer)">
                    <mat-icon matListItemIcon>history</mat-icon>
                    <span matListItemTitle>History</span>
                </a>
                <a mat-list-item routerLink="/weekly-cleaning" (click)="drawerToggle(drawer)">
                    <mat-icon matListItemIcon>date_range</mat-icon>
                    <span matListItemTitle>Weekly Cleaning</span>
                </a>
                <a mat-list-item routerLink="/grocery-list" (click)="drawerToggle(drawer)">
                    <mat-icon matListItemIcon>shopping_cart</mat-icon>
                    <span matListItemTitle>Grocery List</span>
                </a>
                <a mat-list-item routerLink="/inventory" (click)="drawerToggle(drawer)">
                    <mat-icon matListItemIcon>shelves</mat-icon>
                    <span matListItemTitle>Inventory</span>
                </a>
                <a mat-list-item routerLink="/cooking-notes" (click)="drawerToggle(drawer)">
                    <mat-icon matListItemIcon>content_paste</mat-icon>
                    <span matListItemTitle>Cooking Notes</span>
                </a>
                <a mat-list-item routerLink="/settings" (click)="drawerToggle(drawer)">
                    <mat-icon matListItemIcon>settings</mat-icon>
                    <span matListItemTitle>Settings</span>
                </a>
            </mat-nav-list>
        </mat-sidenav>

        <mat-sidenav-content>
            <mat-toolbar color="primary">
                <button type="button" aria-label="Toggle sidenav" mat-icon-button (click)="drawer.toggle()">
                    <mat-icon aria-label="Side nav toggle icon">menu</mat-icon>
                </button>
                <span>Level-Up Roomies</span>
                <span class="spacer"></span>
                <button mat-icon-button (click)="logout()">
                    <mat-icon>logout</mat-icon>
                </button>
            </mat-toolbar>

            <div class="main-content">
                <router-outlet></router-outlet>
            </div>
        </mat-sidenav-content>
    </mat-sidenav-container>
</div>

<ng-template #simpleLayout>
    <router-outlet></router-outlet>
</ng-template>

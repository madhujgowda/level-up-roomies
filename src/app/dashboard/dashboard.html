<div class="dashboard-container">
  <h2 class="mat-headline-small">Hello, {{ user?.displayName }}!</h2>

  <mat-card class="leaderboard-card mat-elevation-z12" appearance="outlined">
  <mat-card-header>
    <mat-card-title>Points Leaderboard</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <mat-chip-set>
      <mat-chip>Add Dish Points</mat-chip>
      <mat-chip>Add Cooking Points</mat-chip>
    </mat-chip-set>
      <table mat-table [dataSource]="(roomies$ | async) || []" class="mat-elevation-z8">

    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef> Roommate </th>
      <td mat-cell *matCellDef="let r"> {{r.name}} </td>
    </ng-container>

    <ng-container matColumnDef="dishPoints">
      <th mat-header-cell *matHeaderCellDef> Dishes 🧼 </th>
      <td mat-cell *matCellDef="let r"> {{r.dishPoints}} </td>
    </ng-container>

    <ng-container matColumnDef="cookingPoints">
      <th mat-header-cell *matHeaderCellDef> Cooking 🍳 </th>
      <td mat-cell *matCellDef="let r"> {{r.cookingPoints}} </td>
    </ng-container>

    <ng-container matColumnDef="total">
      <th mat-header-cell *matHeaderCellDef> Total </th>
      <td mat-cell *matCellDef="let r"> 
        <strong>{{ r.dishPoints + r.cookingPoints }}</strong> 
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
  </mat-card-content>
</mat-card>


</div>
